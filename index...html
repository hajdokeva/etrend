<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Mounjaro · Método Sudoku (Domingo + Miércoles) – FITatHome®</title>
<style>
:root{--green:#4a6a4a;--green-light:#f0f5f0;--green-border:#c8dcc8;--blue:#4a6aaa;--blue-light:#eef2fa;--blue-border:#b8cce8;--orange:#c8802a;--orange-light:#fff6ed;--amber:#b87020;--purple:#8a6ac8;--purple-light:#f2eefb;--gray:#666;--gray-light:#f5f5f5;--dark:#1a1a1a;--radius:10px;--shadow:0 2px 8px rgba(0,0,0,0.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f0f0;color:var(--dark)}
nav{background:white;border-bottom:1px solid #e0e0e0;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.nav-inner{max-width:820px;margin:0 auto;display:flex;align-items:center}
.nav-title{padding:14px 12px;font-weight:700;font-size:14px;color:var(--green);white-space:nowrap}
.nav-tabs{display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;padding:8px 8px 8px 0}
.nav-tabs::-webkit-scrollbar{display:none}
.tab-btn{padding:7px 12px;border:none;background:var(--gray-light);border-radius:20px;cursor:pointer;font-size:12px;white-space:nowrap;color:var(--gray);font-weight:500;transition:all .2s}
.tab-btn.active{background:var(--green);color:white}
.tab-btn:hover:not(.active){background:var(--green-light);color:var(--green)}
.wrap{max-width:820px;margin:16px auto 0;padding:0 12px 30px}
.card{background:white;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.hero h1{font-size:20px;font-weight:800;margin-bottom:4px}
.hero p{color:var(--gray);font-size:12.5px;line-height:1.5}
.section{display:none}
.section.active{display:block}
.h2{font-size:16px;font-weight:800;margin:2px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--green)}
.h3{font-size:13px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.pill{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:20px;margin-right:5px}
.pill.dom{background:var(--blue-light);color:var(--blue)}
.pill.mie{background:var(--orange-light);color:var(--orange)}
.pill.frozen{background:var(--purple-light);color:var(--purple)}
.session-card{border-radius:var(--radius);padding:13px 15px;margin-bottom:12px;border:1px solid #eee}
.session-card.dom{background:var(--blue-light);border-color:var(--blue-border)}
.session-card.mie{background:var(--orange-light);border-color:#f0d0a0}
.session-title{font-size:14px;font-weight:700;margin:4px 0 8px}
.batch-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px dashed rgba(0,0,0,.08)}
.tick-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 2px;border-bottom:1px dashed rgba(0,0,0,.08);cursor:pointer;user-select:none}
.tick-row input[type=checkbox]{width:16px;height:16px;flex-shrink:0;accent-color:var(--green)}
.tick-row .tick-name{flex:1}
.tick-row .tick-amt{font-weight:700;color:var(--gray);white-space:nowrap}
.tick-row.checked .tick-name{text-decoration:line-through;color:#aaa}
.tick-row.checked .tick-amt{color:#ccc}
.tick-progress{font-size:10.5px;color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:6px 0 2px;display:flex;justify-content:space-between;align-items:center}
.tick-reset{background:none;border:1px solid #ddd;border-radius:20px;padding:2px 9px;font-size:9.5px;color:var(--gray);cursor:pointer}
.batch-row:last-child{border-bottom:none}
.batch-name{color:var(--dark)}
.batch-amt{font-weight:700;color:var(--gray)}
.sauce-box{background:white;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12px;color:var(--gray);line-height:1.5}
.sauce-box strong{color:var(--dark)}
table.grid{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
table.grid th{background:var(--dark);color:white;padding:7px 6px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px}
table.grid td{padding:7px 6px;border-bottom:1px solid #f0f0f0;vertical-align:top}
table.grid tr:nth-child(even){background:#fafafa}
.day-lbl{font-weight:700;font-size:12px}
.tipo-lbl{font-size:10px;color:var(--gray);text-transform:uppercase}
.kcal-lbl{font-weight:700;color:var(--green);white-space:nowrap}
.ci{background:var(--green-light);border:1px solid var(--green-border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--dark);line-height:1.6;margin-bottom:12px}
.method-grid{display:grid;grid-template-columns:1fr;gap:10px}
.method-card{background:var(--gray-light);border-radius:8px;padding:11px 13px}
.method-card .mname{font-weight:700;font-size:13px;margin-bottom:2px}
.method-card .msub{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.method-card .mtext{font-size:12px;color:var(--gray);line-height:1.5}
.tip-box{background:var(--dark);color:white;border-radius:8px;padding:12px 14px;font-size:12.5px;line-height:1.6;margin-top:10px}
.tip-box strong{color:var(--orange-light)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-box{border-radius:8px;padding:10px;text-align:center;background:var(--green-light)}
.stat-box .val{font-size:17px;font-weight:700;color:var(--green)}
.stat-box .lbl{font-size:10px;color:var(--gray);margin-top:2px}
table.ref{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px}
table.ref th{background:var(--dark);color:white;padding:7px 6px;text-align:left;font-size:10px;text-transform:uppercase}
table.ref td{padding:7px 6px;border-bottom:1px solid #f0f0f0}
table.ref tr:nth-child(even){background:#fafafa}
.frozen-note{font-size:10px;color:var(--purple);font-weight:700}
@media(max-width:480px){.stat-grid{grid-template-columns:repeat(3,1fr)}}

/* ---- Sudoku matrix ---- */
.legend-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:11px;color:var(--gray)}
.legend-row span{display:inline-flex;align-items:center;gap:5px}
.legend-sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.sw-prot{background:#c98f8a}
.sw-carb{background:#b7a68e}
.sw-veg{background:#7a9b6e}
.sw-sauce{background:#16303c}
.meal-block{border:1px solid #eee;border-radius:12px;padding:12px;margin-bottom:12px;background:#fcfcfb}
.meal-block-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.meal-block-head .mday{font-weight:800;font-size:13.5px}
.meal-block-head .mtipo{font-size:10.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;margin-left:6px}
.meal-block-head .mkcal{font-size:11.5px;font-weight:700;color:var(--green);white-space:nowrap}
.sudoku-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sd-cell{border-radius:9px;padding:9px 10px;color:white;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.sd-cell .sd-cat{font-size:9px;text-transform:uppercase;letter-spacing:.5px;opacity:.85;font-weight:700;margin-bottom:2px}
.sd-cell .sd-name{font-size:12.5px;font-weight:700;line-height:1.25}
.sd-cell .sd-sub{font-size:10px;opacity:.85;margin-top:2px}
.sd-prot{background:#c98f8a}
.sd-carb{background:#a99879}
.sd-veg{background:#7a9b6e}
.sd-sauce{background:#16303c}
.frozen-tag{display:inline-block;background:var(--purple-light);color:var(--purple);font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px}
@media(min-width:520px){.sudoku-grid{grid-template-columns:repeat(4,1fr)}}

table.matrix{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px;text-align:center}
.matrix-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:10px}
.matrix-wrap table.matrix{min-width:520px;margin-bottom:0}
table.matrix th{background:var(--dark);color:white;padding:8px 4px;font-size:10.5px;text-transform:uppercase}
table.matrix td{padding:9px 4px;border:1px solid #eee;font-weight:700}
table.matrix td.rowhead{background:var(--gray-light);text-align:left;font-weight:700;font-size:11.5px;text-transform:none}
td.ideal{background:#e3f3e3;color:#2f7a3f}
td.ok{background:#fbf7e8;color:#a07d1a}
td.avoid{background:#fbe6e6;color:#b03030}
.triad-card{border-radius:10px;padding:12px 14px;margin-bottom:10px;border-left:5px solid}
.triad-card.A{background:var(--blue-light);border-color:var(--blue)}
.triad-card.B{background:var(--orange-light);border-color:var(--amber)}
.triad-card.C{background:var(--purple-light);border-color:var(--purple)}
.triad-title{font-weight:800;font-size:13px;margin-bottom:4px}
.triad-items{font-size:12px;color:var(--gray)}
.dish-card{border:1px solid #eee;border-radius:12px;padding:12px;margin-bottom:10px;background:#fcfcfb}
.dish-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.dish-span{font-weight:800;font-size:13px}
.dish-kcal{font-size:11.5px;font-weight:700;color:var(--green);white-space:nowrap}
.cook-amount{margin-top:9px;background:var(--green-light);border:1px solid var(--green-border);border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.5;color:var(--dark)}

.pairing-map{border-radius:12px;padding:12px;margin:4px 0 14px;border:2px dashed}
.pairing-map.dom{background:var(--blue-light);border-color:var(--blue-border)}
.pairing-map.mie{background:var(--orange-light);border-color:#f0d0a0}
.pairing-map-title{font-weight:800;font-size:12.5px;margin-bottom:8px}
.pairing-map-grid{display:grid;grid-template-columns:1fr;gap:8px}
.pair-sauce{background:white;border-radius:8px;padding:9px 11px}
.pair-sauce-name{font-weight:700;font-size:12.5px;margin-bottom:4px}
.pair-row{font-size:11.5px;margin-bottom:2px}
.pair-good{color:#2f7a3f}
.pair-bad{color:#b03030}
.pair-why{font-size:10.5px;color:var(--gray);margin-top:4px;line-height:1.4;font-style:italic}
@media(min-width:520px){.pairing-map-grid{grid-template-columns:1fr 1fr}}
</style>
</head>

  let cells = carbIds.map(cid=>{
    const v = sauce_carb[sid+"|"+cid];
    return `<td class="${v}">${v==="ideal"?"✅":v==="avoid"?"🚫":"🆗"}</td>`;

  return `<tr><td class="rowhead">${sauces[sid].name}</td>${cells}</tr>`;

let carbMatrixHead = `<tr><th></th>${carbIds.map(cid=>`<th>${carbs[cid].name}</th>`).join("")}</tr>`;

let vegMatrixRows = sauceIds.map(sid=>{
  let cells = vegIds.map(vid=>{
    const v = sauce_veg[sid+"|"+vid];
    return `<td class="${v}">${v==="ideal"?"✅":v==="avoid"?"🚫":"🆗"}</td>`;
  }).join("");
  return `<tr><td class="rowhead">${sauces[sid].name}</td>${cells}</tr>`;
}).join("");
let vegMatrixHead = `<tr><th></th>${vegIds.map(vid=>`<th>${veg[vid].name}</th>`).join("")}</tr>`;

let carbVegRows = carbIds.map(cid=>{
  let cells = vegIds.map(vid=>{
    const v = carb_veg[cid+"|"+vid];
    return `<td class="${v}">${v==="ideal"?"✅":v==="avoid"?"🚫":"🆗"}</td>`;
  }).join("");
  return `<tr><td class="rowhead">${carbs[cid].name}</td>${cells}</tr>`;
}).join("");
let carbVegHead = `<tr><th></th>${vegIds.map(vid=>`<th>${veg[vid].name}</th>`).join("")}</tr>`;

let protIds = Object.keys(proteins);
let protCarbRows = protIds.map(pid=>{
  let cells = carbIds.map(cid=>{
    const v = protein_carb[pid+"|"+cid];
    return `<td class="${v}">${v==="ideal"?"✅":v==="avoid"?"🚫":"🆗"}</td>`;
  }).join("");
  return `<tr><td class="rowhead">${proteins[pid].name}</td>${cells}</tr>`;
}).join("");
let protCarbHead = `<tr><th></th>${carbIds.map(cid=>`<th>${carbs[cid].name}</th>`).join("")}</tr>`;

let protSauceRows = protIds.map(pid=>{
  let cells = sauceIds.map(sid=>{
    const v = protein_sauce[pid+"|"+sid];
    return `<td class="${v}">${v==="ideal"?"✅":v==="avoid"?"🚫":"🆗"}</td>`;
  }).join("");
  return `<tr><td class="rowhead">${proteins[pid].name}</td>${cells}</tr>`;
}).join("");
let protSauceHead = `<tr><th></th>${sauceIds.map(sid=>`<th style="font-size:9px">${sauces[sid].name}</th>`).join("")}</tr>`;

r.innerHTML = `
<div class="card">
  <div class="h2">🧩 Matriz de combinación (4 proteínas · 3 carbs · 6 vegetales · 10 salsas)</div>
  <div class="ci">4 proteínas: <strong>pechuga, muslo, dorada, res magra (5% grasa)</strong>. 3 carbohidratos: <strong>papa, camote, bulgur</strong>. 6 vegetales: <strong>ejotes, zanahoria, calabacín, pimientos, tomate, ensalada mixta</strong>. 10 salsas: <strong>Tzatziki, Hierbas Verdes, Pimiento Asado Cremosa, Cúrcuma-Jengibre, Mostaza Agridulce, Remolacha Cremosa, Jengibre-Soya, Albahaca-Balsámico, Cilantro-Lima Cremosa, Salsa de Tomate</strong>. La Salsa de Tomate es exclusiva de la res magra — siempre que sale res, va con esta salsa y ensalada mixta. Las otras 9 son suaves, a base de yogur griego 0% y sin picante — combinan con pechuga, muslo y dorada sin restricción.</div>
  <div class="ci" style="background:#fff6ed;border-color:#f0d0a0">📋 <strong>De tus 8 marinadas:</strong> adapté <em>Basil Balsamic</em> → Albahaca-Balsámico (sin aceite, miel→Monk Fruit). <em>Honey Mustard</em> ya la teníamos (Mostaza Agridulce). <em>Greek</em> y <em>Lemon Chicken</em> ya están cubiertas por Tzatziki y Hierbas Verdes. No agregué <em>Pineapple Teriyaki</em> (piña no está en tu lista de permitidos, y el teriyaki suele llevar azúcar) ni <em>Honey Garlic</em> tal cual (llevaba miel). También sumé <strong>Cilantro-Lima Cremosa</strong> — verifiqué que cilantro + yogur griego es una combinación real y usada (tacos, pollo, pescado, verduras asadas), aunque el nombre "criolla peruana" no era exacto: la salsa verde peruana tradicional lleva ají y suele ser a base de mayonesa, no yogur.</div>
  <div class="h3">Las 10 salsas</div>
  <div class="ci" style="background:var(--purple-light);border-color:#ddd0f2;margin-bottom:8px">🥩 <strong>Combinación fija:</strong> cada vez que el plato lleva carne de res magra, la salsa siempre es <strong>Salsa de Tomate</strong> y el vegetal siempre es <strong>Ensalada Mixta</strong> — es su combinación clásica y no rota como las demás.</div>
  <table class="ref"><tr><th>Estilo</th><th>Salsa</th><th>Ingredientes</th><th>Cal/2cdas</th><th>Prot/2cdas</th></tr>${Object.values(sauces).map(s=>`<tr><td>${s.style}</td><td>${s.name}</td><td>${s.recipe}</td><td>${s.kcal}</td><td>${s.prot}g</td></tr>`).join("")}</table>
  <div class="h3">Salsa × Carbohidrato</div>
  <div class="matrix-wrap"><table class="matrix">${carbMatrixHead}${carbMatrixRows}</table></div>
  <div class="h3">Salsa × Vegetal</div>
  <div class="matrix-wrap"><table class="matrix">${vegMatrixHead}${vegMatrixRows}</table></div>
  <div class="h3">Carbohidrato × Vegetal</div>
  <div class="matrix-wrap"><table class="matrix">${carbVegHead}${carbVegRows}</table></div>
  <div class="h3">Proteína × Carbohidrato</div>
  <div class="matrix-wrap"><table class="matrix">${protCarbHead}${protCarbRows}</table></div>
  <div class="h3">Proteína × Salsa</div>
  <div class="matrix-wrap"><table class="matrix">${protSauceHead}${protSauceRows}</table></div>
  <div class="ci" style="background:#fdeeee;border-color:#f0c8c8;margin-top:2px">🚫 <strong>El camote es el ingrediente con más restricciones:</strong> como salsa, solo combina bien con Cúrcuma-Jengibre, Jengibre-Soya, Mostaza Agridulce o Remolacha Cremosa (nunca Tzatziki, Hierbas Verdes, Pimiento Asado ni Salsa de Tomate). Como vegetal, solo combina bien con zanahoria, pimientos y la ensalada mixta — el resto (ejotes, calabacín, tomate cocido) no tanto. Papa y bulgur no tienen ninguna restricción.</div>
  <div class="ci" style="background:#fdeeee;border-color:#f0c8c8">🐟 <strong>La dorada nunca va con camote</strong> — solo con papa o bulgur.</div>
  <div class="ci" style="background:var(--purple-light);border-color:#ddd0f2">🌱 <strong>Remolacha Cremosa siempre va con Ensalada Mixta</strong> (que lleva remolacha adentro) — combinación fija, igual que la res con Salsa de Tomate.</div>
  <div class="ci" style="background:var(--blue-light);border-color:var(--blue-border)">🥗 <strong>Ensalada Mixta siempre va sola</strong> — al ser una ensalada fresca, nunca se mezcla con vegetales cocidos en el mismo plato. Cuando le toca al camote, alterna entre Ensalada Mixta sola o el dúo cocido Zanahoria+Pimientos, nunca los dos juntos.</div>
  <div class="ci" style="background:var(--orange-light);border-color:#f0d0a0">🫚 <strong>Las salsas con jengibre (Cúrcuma-Jengibre, Jengibre-Soya) nunca llevan tomate como vegetal</strong> — solo ejotes, zanahoria, calabacín o pimientos.</div>
  <div class="ci" style="background:var(--orange-light);border-color:#f0d0a0">🥕 <strong>El dúo Zanahoria+Pimientos cocido solo va con salsas más dulces</strong> (Mostaza Agridulce, Jengibre-Soya). Con Cúrcuma-Jengibre —cálida pero no dulce— el camote siempre lleva Ensalada Mixta sola.</div>
  <div class="ci" style="background:var(--green-light);border-color:var(--green-border)">🧊 <strong>El último plato de la semana (el congelado) siempre lleva Ensalada Mixta</strong> — no necesita cocción extra, ideal para el día más viejo del lote.</div>
  <div class="ci" style="background:#fff6ed;border-color:#f0d0a0"><strong>⚠️ Sobre el borsó (arveja/guisante):</strong> no lo agregué todavía — botánicamente es legumbre, misma familia que el "bab" (frijol) de tu lista de "no permitidos". Confírmamelo y lo sumo.</div>
</div>
<div class="card">
  <div class="h2">Proteína + salsa se marinan juntas y se repiten — carbohidrato y vegetal cambian</div>
  <div class="ci">Cada plato se cocina una sola vez, pero ahora la <strong>proteína se marina en la misma salsa</strong> que va a llevar toda su vida (cena + almuerzo del día siguiente) — así el marinado tiene sentido real. El <strong>carbohidrato y el vegetal cambian entre la cena y el almuerzo siguiente</strong>, dándote variedad real dentro del mismo plato sin duplicar el trabajo de marinar/cocinar la proteína. La salsa siempre determina qué carbohidratos son válidos para las dos comidas (el camote solo aparece si la salsa lo permite).</div>
</div>
<div class="card">
  <div class="h2">¿Cómo funciona?</div>
  <div class="ci"><strong>La cena de hoy es el mismo plato que el almuerzo de mañana</strong> (sobras) — así solo cocinas 2 veces por semana y cada plato rinde para 2 comidas × 2 personas (4 porciones).</div>
  <div class="ci"><strong>Domingo</strong> cocinas 3 platos → cubren de domingo en la noche a miércoles al mediodía. <strong>Miércoles</strong> cocinas 4 platos → cubren de miércoles en la noche a domingo al mediodía (el último se guarda congelado, son los días 3-4).</div>
  <div class="h3">Métodos de cocción</div>
  <div class="method-grid">
    <div class="method-card"><div class="mname">Air Fryer</div><div class="msub">Freidora de aire</div><div class="mtext">Ideal para pechuga y dorada. Precalienta a 200°C/400°F. Pollo: 18-22 min volteando a la mitad · Pescado: 10-12 min.</div></div>
    <div class="method-card"><div class="mname">Olla lenta</div><div class="msub">Slow cooker</div><div class="mtext">Perfecta para el muslo desmechado. Cocina en LOW 6-8 hrs o HIGH 3-4 hrs.</div></div>
    <div class="method-card"><div class="mname">Horno</div><div class="msub">Batch cooking</div><div class="mtext">El método más práctico para las cantidades grandes. Bandeja con papel pergamino. Pollo: 200°C/400°F por 22-25 min. Vegetales en otra bandeja al mismo tiempo.</div></div>
  </div>
  <div class="tip-box"><strong>Tip general:</strong> usa termómetro de cocina — pollo a 74°C/165°F interno, pescado hasta que esté opaco y se desmenuce fácil. Guarda en refrigerador 3-5 días o congela hasta 3 meses (descongela 24h antes). Nunca congeles las salsas de yogur — cambian de textura; prepáralas frescas cada sesión.</div>
</div>
<div class="card">
  <div class="h2">🧂 Cómo marinar cada proteína</div>
  <div class="ci">Por defecto, usa 2-3 cdas de la <strong>misma salsa del día</strong> como base de marinado + sal y pimienta. El tiempo de marinado cambia mucho según la proteína:</div>
  <div class="method-grid">
    ${Object.entries(marinades).map(([pid,m])=>`
    <div class="method-card"><div class="mname">${proteins[pid].name}</div><div class="msub">${m.time}</div><div class="mtext">${m.note}</div></div>`).join("")}
  </div>
  <div class="ci" style="background:#fdeeee;border-color:#f0c8c8;margin-top:10px">🚫 <strong>No todas las salsas sirven como marinado:</strong>
    <ul style="margin:6px 0 0 18px;padding:0">
      ${Object.entries(marinade_mode).filter(([sid,mm])=>mm.mode!=="salsa").map(([sid,mm])=>
        `<li style="margin-bottom:4px"><strong>${sauces[sid].name}</strong> — ${mm.mode==="neutral"?"marina en ajo+limón+sal+pimienta, sirve la salsa fresca aparte":"cocina la proteína directo en la salsa, sin marinar"}: ${mm.why}</li>`
      ).join("")}
    </ul>
  </div>
</div>`;
sec.appendChild(r);

// ---- WEEKS ----
weeks.forEach(w=>{
  const el = document.createElement("div"); el.className="section"; el.id="sec-w"+w.week;

  const dayTotals = {};
  w.meals.forEach(m=>{ (dayTotals[m.day]=dayTotals[m.day]||[0,0])[0]+=m.kcal; dayTotals[m.day][1]+=m.prot; });
  const avgKcalDay = Math.round(Object.values(dayTotals).reduce((s,v)=>s+v[0],0)/7);
  const avgProtDay = Math.round(Object.values(dayTotals).reduce((s,v)=>s+v[1],0)/7);

  let tickIdCounter = 0;
  function tickRow(name, amt, groupId){
    const id = `tick_${groupId}_${tickIdCounter++}`;
    return `<label class="tick-row" id="row_${id}" for="${id}">
      <input type="checkbox" id="${id}" onchange="onTickChange(this)">
      <span class="tick-name">${name}</span><span class="tick-amt">${amt}</span>
    </label>`;
  }

  function cookTotalBlock(shop, nDishes){
    let rows = "";
    shop.proteinas.forEach(([name,g])=>{ rows += `<div class="batch-row"><span class="batch-name">${name}</span><span class="batch-amt">${fmtg(g)}</span></div>`; });
    shop.carbs.forEach(([name,g])=>{ rows += `<div class="batch-row"><span class="batch-name">${name}</span><span class="batch-amt">${fmtg(g)}</span></div>`; });
    shop.veg.forEach(([name,g])=>{ rows += `<div class="batch-row"><span class="batch-name">${name}</span><span class="batch-amt">${fmtg(g)}</span></div>`; });
    return `<div class="tip-box">
      <strong>🔥 Total combinado a cocinar de una vez (${nDishes} platos juntos):</strong>
      <div style="background:rgba(255,255,255,.08);border-radius:8px;padding:8px 10px;margin-top:8px">${rows}</div>
      <div style="margin-top:8px;font-size:11.5px;opacity:.85">Mete todas las proteínas en bandejas separadas (marinadas cada una en su salsa), y todos los carbohidratos y vegetales en sus propias bandejas — todo al horno/air fryer a la vez, y luego repartes por plato.</div>
    </div>`;
  }

  function shopBlock(label, cls, shop, groupId){
    let items = [];
    shop.proteinas.forEach(([name,g])=>items.push([name, fmtg(g)]));
    shop.carbs.forEach(([name,g])=>items.push([name, fmtg(g)]));
    shop.veg.forEach(([name,g])=>items.push([name, fmtg(g)]));
    let rows = items.map(([n,a])=>tickRow(n,a,groupId)).join("");
    let salsaRows = "";
    if(shop.salsas && shop.salsas.length){
      salsaRows = `<div style="font-size:10.5px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;margin:8px 0 2px">🥣 Para las salsas</div>`
        + shop.salsas.map(([n,a])=>tickRow(n,a,groupId)).join("");
    }
    return `<div class="session-card ${cls}"><span class="pill ${cls}">${label}</span><div class="session-title">🛒 Compra para esta sesión</div>${rows}${salsaRows}</div>`;
  }

  const dayNamesByDish = {};
  w.meals.forEach(m=>{ (dayNamesByDish[m.dish]=dayNamesByDish[m.dish]||[]).push(m); });

  function dishCardHtml(did){
    const slots = dayNamesByDish[did];
    const cena = slots.find(x=>x.tipo==="Cena");
    const alm = slots.find(x=>x.tipo==="Almuerzo");
    const p = proteins[cena.protein], s = sauces[cena.sauce];
    const protBatch = w.dish_protein_batch[did];

    function mealBlock(m, label){
      const c = carbs[m.carb];
      const vegNames = m.veg_mix.map(([vid,g])=>veg[vid].name).join(" + ");
      const vegGrams = m.veg_mix.map(([vid,g])=>`${g}g ${veg[vid].name.toLowerCase()}`).join(", ");
      const cookVegStr = m.cook_veg_mix.map(([vid,g])=>`${g}g ${veg[vid].name.toLowerCase()}`).join(" · ");
      return `
      <div style="margin-top:8px">
        <div style="font-size:11px;font-weight:800;color:var(--dark);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px">${label} · ${m.day}</div>
        <div class="sudoku-grid" style="grid-template-columns:1fr 1fr">
          <div class="sd-cell sd-carb"><div class="sd-cat">Carbohidrato</div><div class="sd-name">${c.name}</div><div class="sd-sub">${c.raw_g}g crudo → ~${c.cooked_g}g cocido</div></div>
          <div class="sd-cell sd-veg"><div class="sd-cat">Vegetales</div><div class="sd-name" style="font-size:11px">${vegNames}</div><div class="sd-sub">${vegGrams}</div></div>
        </div>
        <div class="cook-amount" style="margin-top:6px">🍳 Para 2 personas: ${m.cook_carb_g}g ${c.name.toLowerCase()} crudo (~${c.cooked_g*2}g cocido) · ${cookVegStr}</div>
        <div style="text-align:right;font-size:11px;font-weight:700;color:var(--green);margin-top:3px">${m.kcal} kcal · ${m.prot}g prot</div>
      </div>`;
    }

    const mm = marinade_mode[cena.sauce];
    let marinadeText;
    if(mm.mode === "salsa"){
      marinadeText = `— marina toda la tanda en la salsa antes de cocinar.`;
    } else if(mm.mode === "neutral"){
      marinadeText = `— <strong>no marines en esta salsa:</strong> marina en ajo + limón + sal + pimienta, cocina, y sirve la ${s.name.toLowerCase()} fresca aparte (${mm.why})`;
    } else {
      marinadeText = `— <strong>no se marina:</strong> cocina la proteína directamente sumergida en la salsa (${mm.why})`;
    }

    return `
    <div class="dish-card">
      <div class="dish-head">
        <div><span class="dish-span">${cena.day} Cena → ${alm.day} Almuerzo</span>${cena.frozen?'<span class="frozen-tag">🧊 congelado</span>':''}</div>
      </div>
      <div class="sudoku-grid" style="grid-template-columns:1fr 1fr">
        <div class="sd-cell sd-prot"><div class="sd-cat">Proteína${mm.mode==="salsa"?" (marinada, se repite)":""}</div><div class="sd-name">${p.name}</div><div class="sd-sub">${p.raw_g}g crudo → ~${p.cooked_g}g cocido</div></div>
        <div class="sd-cell sd-sauce"><div class="sd-cat">Salsa (acompañamiento${mm.mode==="salsa"?" + marinado":""})</div><div class="sd-name">${s.name}</div><div class="sd-sub">2 cdas/porción</div></div>
      </div>
      <div class="cook-amount">🧂 <strong>Proteína a cocinar (rinde 4 porciones):</strong> ${protBatch}g ${p.name.toLowerCase()} crudo (~${p.cooked_g*4}g cocido) ${marinadeText}</div>
      ${mealBlock(cena, "🌙 Cena")}
      ${mealBlock(alm, "☀️ Almuerzo del día siguiente")}
    </div>`;
  }

  const sunDishIds = Object.keys(dayNamesByDish).filter(id=>id.startsWith("S"));
  const wedDishIds = Object.keys(dayNamesByDish).filter(id=>id.startsWith("W"));
  const sunDishCards = sunDishIds.map(dishCardHtml).join("");
  const wedDishCards = wedDishIds.map(dishCardHtml).join("");

  const thisWeekRows = Object.entries(w.dish_info_summary).map(([slot,fx])=>
    `<tr><td class="rowhead">${slot}</td><td>${proteins[fx.protein].name}</td><td>${sauces[fx.sauce].name}</td></tr>`
  ).join("");

  el.innerHTML = `
    <div class="card">
      <div class="h2">Semana ${w.week}</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="val">~${avgKcalDay}</div><div class="lbl">kcal/día (comidas principales)</div></div>
        <div class="stat-box"><div class="val">~${avgProtDay}g</div><div class="lbl">proteína/día (comidas principales)</div></div>
        <div class="stat-box"><div class="val">+608 / +40g</div><div class="lbl">desayuno + meriendas fijos</div></div>
      </div>
      <div class="h3">Proteína y salsa de esta semana (se marinan juntas, se repiten en cena+almuerzo)</div>
      <table class="matrix"><tr><th>Plato</th><th>Proteína</th><th>Salsa</th></tr>${thisWeekRows}</table>
      <div class="h3" style="margin-top:14px">🗓️ Preparación 1 — Domingo (3 platos, cubren hasta el miércoles al mediodía)</div>
      ${shopBlock("Domingo","dom", w.sunday_shopping, "w"+w.week+"s")}
      <div class="h3" style="margin-top:14px">🗓️ Preparación 2 — Miércoles (4 platos, cubren hasta el domingo al mediodía)</div>
      ${shopBlock("Miércoles","mie", w.wednesday_shopping, "w"+w.week+"m")}
      <div class="h3" style="margin-top:14px">🥣 Desayuno y meriendas (fijo toda la semana, 2 personas)</div>
      <div class="session-card" style="background:var(--gray-light)">
        ${fixed_items.map(([n,a])=>tickRow(n,a,"w"+w.week+"fixed")).join("")}
      </div>
    </div>
    <div class="card">
      <div class="h3">🗓️ Preparación 1 — Domingo: qué cocinar, plato por plato</div>
      <div class="ci" style="margin-bottom:10px">Cada tarjeta = 1 plato que cubre la cena de un día y el almuerzo del día siguiente (sobras). Cocinas 4 porciones de una vez.</div>
      ${cookTotalBlock(w.sunday_shopping, 3)}
      ${sunDishCards}
    </div>
    <div class="card">
      <div class="h3">🗓️ Preparación 2 — Miércoles: qué cocinar, plato por plato</div>
      <div class="ci" style="margin-bottom:10px">Igual que el domingo: cada tarjeta cubre 2 comidas. El último plato (🧊) se separa congelado desde el miércoles.</div>
      ${cookTotalBlock(w.wednesday_shopping, 4)}
      ${wedDishCards}
    </div>`;
  sec.appendChild(el);
});
</script>
</body></html>
